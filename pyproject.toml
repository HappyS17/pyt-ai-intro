[project]
name = "pyt-ai-intro"
version = "1.0.0"
description = "Python & KI-gestütztes Programmieren"
readme = "README.md"
requires-python = ">=3.13.1"
dependencies = [
    "anthropic>=0.72.0",
    "openai>=2.7.1",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.1",
    "pytest-xdist>=3.3.1",
    "pytest-timeout>=2.1.0",
    "coverage>=7.2.0",
    "coverage-badge>=1.1.0",
    "requests-mock>=1.11.0",
]
